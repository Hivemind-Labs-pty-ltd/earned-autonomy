[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earned-autonomy"
version = "0.7.0"
description = "Reference trust engine for the Earned Autonomy Framework: AI agents earn autonomy like employees."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "../conformance"]
pythonpath = ["src", "tests", "../conformance"]
markers = ["covers(*rule_ids): the spec rules (EA-x.y) this test checks"]
